name: Release

# Push a tag like v1.0.12 (matching package.json) to publish that commit as a GitHub release:
# the tests run first, then the package is built here, with build-info.json recording the
# tag and commit, and attached to the release with its SHA-256 checksum. The Pi installs
# these releases with `sudo wyze-plugin-update` (tools/pi-update.sh).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run dev:matterbridge
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, but package.json says $v"; exit 1; }
      - name: Record what this build is
        run: >
          node -e "require('fs').writeFileSync('build-info.json', JSON.stringify({
          tag: process.env.GITHUB_REF_NAME, commit: process.env.GITHUB_SHA, built: new Date().toISOString(),
          run: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID
          }, null, 2) + '\n')"
      - run: npm pack   # also checks dependencies, lints and builds (prepack)
      - name: Checksum
        run: sha256sum matterbridge-wyze-robovac-*.tgz | tee SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "[" v "]") > 0 } p' CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" matterbridge-wyze-robovac-*.tgz SHA256SUMS tools/pi-update.sh --title "$GITHUB_REF_NAME" --notes-file notes.md
