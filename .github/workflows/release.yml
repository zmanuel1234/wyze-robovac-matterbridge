name: Release

# Publishes a commit as a GitHub release, in either of two ways:
#   - on GitHub: Actions -> Release -> "Run workflow" on main. The version comes from
#     package.json and the tag (e.g. v1.0.12) is created by the release itself;
#   - from a computer: push a tag like v1.0.12 that matches package.json.
# The tests run first, then the package is built here, with build-info.json recording the
# tag and commit, and attached to the release with its SHA-256 checksum. The Pi installs
# these releases with `sudo wyze-plugin-update` (tools/pi-update.sh).
#
# A version with a pre-release part becomes a GitHub pre-release and leaves npm's "latest"
# (what everyone else gets) alone: 1.2.0-dev-1 goes to npm's "dev" tag, where the
# Matterbridge UI looks for a plugin's dev version; others (e.g. 1.2.0-rc.1) to "next".
#
# The "npm" job then publishes the same package to npm, with npm's trusted publishing
# (no token stored anywhere). It only runs when the repository variable NPM_PUBLISH is
# "true", after this repository and release.yml are registered as the package's trusted
# publisher on npmjs.com (package -> Settings -> Trusted publishing).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Hardening: the job that runs npm (installs, lint, build, pack) has a read-only token
# that is not stored in the checkout, and installs run without package install scripts.
# Only the "release" job can write, and it runs no repository or npm code: it uploads
# what "build" produced. Actions are pinned to commits. Releases come only from main or
# from a v* tag.
jobs:
  tests:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1       # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1     # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run dev:matterbridge
      - name: Work out the release tag from package.json
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $tag"; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Raise the version in package.json first."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Record what this build is
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: >
          node -e "require('fs').writeFileSync('build-info.json', JSON.stringify({
          tag: process.env.TAG, commit: process.env.GITHUB_SHA, built: new Date().toISOString(),
          run: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID
          }, null, 2) + '\n')"
      - run: npm pack   # also checks dependencies, lints and builds (prepack)
      - name: Checksum
        run: sha256sum matterbridge-wyze-robovac-plus-*.tgz | tee SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "[" v "]") > 0 } p' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            matterbridge-wyze-robovac-plus-*.tgz
            SHA256SUMS
            notes.md
            tools/pi-update.sh
            tools/migrate-to-plus.sh
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ needs.build.outputs.tag }}
    permissions:
      contents: write   # to create the release; this job runs no repository or npm code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the package against its checksum
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" matterbridge-wyze-robovac-plus-*.tgz SHA256SUMS tools/pi-update.sh tools/migrate-to-plus.sh \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md $pre

  npm:
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # npm trusted publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1     # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g --ignore-scripts npm@11.21.2   # trusted publishing needs npm 11.5.1 or later
      - name: Download the released package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Publish to npm
        env:
          # Provenance needs a public repository; skip it while this one is private.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          case "$TAG" in
            *-dev-*|*-git-*) npm publish ./*.tgz --access public --tag dev ;;    # Matterbridge's dev channel
            *-*)             npm publish ./*.tgz --access public --tag next ;;   # other test versions (e.g. -rc.1)
            *)               npm publish ./*.tgz --access public ;;
          esac
