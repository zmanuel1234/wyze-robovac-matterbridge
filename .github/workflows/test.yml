name: Tests

on:
  push:
    branches: ['**']   # tags run these tests through release.yml instead
  pull_request:
  workflow_dispatch:
  workflow_call:       # used by release.yml
  schedule:
    - cron: '17 6 * * 1'   # Mondays: catches breakage from new Matterbridge 3.x or wyze-sdk releases

permissions:
  contents: read

jobs:
  # Each job runs in Debian with the given Python (GitHub's own Ubuntu machines no longer
  # offer Python 3.9, the version Raspberry Pi OS 11 has).
  plugin:
    name: Plugin (Node 22, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-bookworm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']   # 3.9 is what the Pi runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1       # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1     # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run dev:matterbridge
      - run: npm run check:deps
      - run: npm run lint
      - run: npm test
        env:
          PYTHON: python3

  wyze-sdk:
    name: Real wyze-sdk ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-bookworm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '2.2.0 (Python 3.9, as on the Pi)', python: '3.9', sdk: '==2.2.0' }
          - { label: 'latest (Python 3.12)', python: '3.12', sdk: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1       # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --no-cache-dir "wyze-sdk${{ matrix.sdk }}"
      - run: python3 test/sdk_contract.py
